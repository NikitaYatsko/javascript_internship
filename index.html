<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        padding: 20px 20px;
    }

    .hours {
        color: red;
    }

    .minutes {
        color: blue;
    }

    .seconds {
        color: green;
    }

    .employee_list {
        margin-bottom: 20px;
        border-radius: 25px;
        padding: 20px 20px;
        border: 1px solid black;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;


    }

    .employee {
        border-radius: 25px;
        color: white;
        background: green;
        padding: 20px 20px;
        border: 1px solid black;

    }

    .salary_info {
        margin-top: 20px;
        border-radius: 25px;
        border: 1px solid black;
        padding: 20px 20px;
        font-size: 20px;
    }
</style>
<body>
<div class="time">
    <span class="days">00</span>
    <span>:</span>
    <span class="hours">00</span>
    <span>:</span>
    <span class="minutes">00</span>
    <span>:</span>
    <span class="seconds">00</span>
</div>
<div class="time_buttons">
    <button class="start">Start</button>
    <button class="stop">Stop</button>

</div>
<pre class="json_block">

</pre>

<div class="employee_list">

</div>
<hr>
<div class="salary_info">

</div>

<script type="module" src="js/jscript.js"></script>


</body>
</html>
